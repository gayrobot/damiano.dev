# Public config for the privacy gate. This repo is public, so it holds only
# generic patterns and allowlists. Specific terms to block (family names,
# street names, anything personal) go in the PRIVACY_DENYLIST secret as one
# term per line, so the list itself never becomes public.
patterns:
  phone: '(?<!\d)(?:\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]\d{3}[\s.-]\d{4}(?!\d)'
  street_address: '\b\d{1,6}\s+(?:[A-Z][\w.]*\s+){1,3}(?:St|Street|Ave|Avenue|Rd|Road|Blvd|Boulevard|Dr|Drive|Ln|Lane|Ct|Court|Way|Pl|Place|Terrace|Cir|Circle)\b\.?'
  ssn: '\b\d{3}-\d{2}-\d{4}\b'
  email: '[\w.+-]+@[\w-]+(?:\.[\w-]+)+'

# Emails that are meant to be public. Everything else is flagged.
allowed_emails:
  - skylardamiano@gmail.com

# Public URLs that are meant to be on the site. Removed from each line before
# the denylist and patterns run, so a denylist term that also appears in these
# (e.g. the GitHub username) doesn't block them.
allowed_urls:
  - https://github.com/gayrobot/
