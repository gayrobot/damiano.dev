version: 2
updates:
  # npm: one grouped PR a week for minor/patch updates. Major upgrades are done by hand
  # (they need code changes and testing), so Dependabot never opens them.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions: every action bump (majors included, since old majors lose runner
  # support) in one PR a month.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
