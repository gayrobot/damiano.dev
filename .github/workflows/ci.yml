# Runs on every PR and on main. The "build" check is required by branch
# protection, so a PR that fails type checking or the build can't merge.
# On main, "deploy" ships the exact dist/ that "build" produced.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR runs cancel older runs; main runs queue so a deploy is never cut off midway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site: ${{ steps.changes.outputs.site }}
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Path filtering happens inside the job, not with `on.paths`: a workflow
      # skipped by `paths` never reports "build", and branch protection would
      # leave docs-only PRs waiting on it forever. Here the check always reports
      # and the expensive steps are skipped.
      - name: Did anything the site is built from change?
        id: changes
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          site=true
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" "$AFTER" | grep -qE '^(src/|public/|astro\.config\.mjs$|tsconfig\.json$|package(-lock)?\.json$|wrangler\.jsonc$|\.nvmrc$|\.github/workflows/ci\.yml$)'; then
              site=false
            fi
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "Site files changed: $site"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.site == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.site == 'true'
      - name: Type check
        if: steps.changes.outputs.site == 'true'
        run: npm run check
      - name: Build
        if: steps.changes.outputs.site == 'true'
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.changes.outputs.site == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Cloudflare token lives only in this environment, which only main can use.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
